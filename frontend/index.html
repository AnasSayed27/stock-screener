<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="StockLens — Premium stock screening, fundamental analysis, and investment thesis management tool for Indian equities.">
    <meta name="keywords" content="stock screener, fundamental analysis, investment thesis, Indian stocks, valuation, quality score">
    <meta name="author" content="StockLens">
    <meta name="theme-color" content="#0a0e1a">
    <title>StockLens — Stock Screening &amp; Analysis</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- App Styles -->
    <link rel="stylesheet" href="css/styles.css?v=4">
</head>
<body>
    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Confirmation Modal -->
    <div id="confirm-modal" class="modal-overlay" style="display:none;">
        <div class="modal-card">
            <h3 id="confirm-modal-title">Confirm</h3>
            <p id="confirm-modal-message">Are you sure?</p>
            <div class="modal-actions">
                <button id="confirm-modal-cancel" class="btn btn-secondary">Cancel</button>
                <button id="confirm-modal-ok" class="btn btn-danger">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Mobile Menu Toggle -->
    <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
    </button>

    <!-- Sidebar Overlay (mobile) -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <a href="#dashboard" class="logo-link">
                <div class="logo">
                    <span class="logo-icon">◈</span>
                    <span class="logo-text">Stock<span class="logo-accent">Lens</span></span>
                </div>
            </a>
            <p class="logo-tagline">Discover · Screen · Analyze · Decide</p>
        </div>

        <nav class="sidebar-nav">
            <a href="#dashboard" class="nav-item active" data-page="dashboard">
                <span class="nav-icon">⬡</span>
                <span class="nav-label">Dashboard</span>
            </a>
            <a href="#discovery" class="nav-item" data-page="discovery">
                <span class="nav-icon">◈</span>
                <span class="nav-label">Discovery</span>
            </a>
            <a href="#screener" class="nav-item" data-page="screener">
                <span class="nav-icon">⏣</span>
                <span class="nav-label">Screener</span>
            </a>
            <a href="#analyzer" class="nav-item" data-page="analyzer">
                <span class="nav-icon">◉</span>
                <span class="nav-label">Analyzer</span>
            </a>
            <a href="#thesis" class="nav-item" data-page="thesis">
                <span class="nav-icon">⬢</span>
                <span class="nav-label">Thesis Board</span>
            </a>
            <button id="sidebar-collapse-btn" class="nav-item" style="background: none; border: none; width: calc(100% - 6px); cursor: pointer; margin-top: auto; padding: 12px 16px; color: var(--text-secondary); text-align: left;">
                <span class="nav-icon" id="collapse-icon">◀</span>
                <span class="nav-label">Collapse Menu</span>
            </button>
        </nav>

        <div class="sidebar-footer">
            <div class="sidebar-footer-text">
                <span class="footer-dot"></span>
                Powered by yfinance
            </div>
            <div class="sidebar-api-usage" id="sidebar-api-usage" style="margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border-subtle);">
                <div id="api-usage-header" style="display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-muted); cursor: pointer; user-select: none;" title="Toggle detailed usage stats">
                    <span>⚡ API Info</span>
                    <span id="api-usage-arrow" style="font-size: 8px; transition: transform 0.2s;">▼</span>
                </div>
                <div id="api-usage-summary" style="font-size: 10px; color: var(--text-secondary); margin-top: 4px; display: flex; gap: 8px;">
                    <span>Gemini: <span id="api-sum-gemini">0</span>/d</span>
                    <span>Tavily: <span id="api-sum-tavily">0</span>/m</span>
                </div>
                <div id="api-usage-details" style="display: none; font-size: 10px; color: var(--text-muted); margin-top: 6px; flex-direction: column; gap: 4px;">
                    <div style="display: flex; justify-content: space-between;">
                        <span>Gemini calls (Today):</span>
                        <strong style="color: var(--text-secondary);" id="api-det-gemini">0</strong>
                    </div>
                    <div style="font-size: 8px; color: var(--text-muted); text-align: right; margin-top: -2px;">(resets daily)</div>
                    <div style="display: flex; justify-content: space-between; margin-top: 2px;">
                        <span>Tavily calls (Cycle):</span>
                        <strong style="color: var(--text-secondary);" id="api-det-tavily">0</strong>
                    </div>
                    <div style="font-size: 8px; color: var(--text-muted); text-align: right; margin-top: -2px;">(resets 23rd monthly)</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
        <!-- Pages render here -->
    </main>

    <!-- Scripts (order matters) -->
    <script src="js/utils.js?v=3"></script>
    <script src="js/charts.js?v=3"></script>
    <script src="js/dashboard.js?v=3"></script>
    <script src="js/screener.js?v=6"></script>
    <script src="js/analyzer.js?v=5"></script>
    <script src="js/thesis.js?v=3"></script>
    <script src="js/discovery.js?v=3"></script>
    <script src="js/app.js?v=3"></script>
</body>
</html>
