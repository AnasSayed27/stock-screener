<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="StockLens — Premium stock screening, fundamental analysis, and investment thesis management tool for Indian equities.">
    <meta name="keywords" content="stock screener, fundamental analysis, investment thesis, Indian stocks, valuation, quality score">
    <meta name="author" content="StockLens">
    <meta name="theme-color" content="#0a0e1a">
    <title>StockLens — Stock Screening &amp; Analysis</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- App Styles -->
    <link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body>
    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Confirmation Modal -->
    <div id="confirm-modal" class="modal-overlay" style="display:none;">
        <div class="modal-card">
            <h3 id="confirm-modal-title">Confirm</h3>
            <p id="confirm-modal-message">Are you sure?</p>
            <div class="modal-actions">
                <button id="confirm-modal-cancel" class="btn btn-secondary">Cancel</button>
                <button id="confirm-modal-ok" class="btn btn-danger">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Mobile Menu Toggle -->
    <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
    </button>

    <!-- Sidebar Overlay (mobile) -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <a href="#dashboard" class="logo-link">
                <div class="logo">
                    <span class="logo-icon">◈</span>
                    <span class="logo-text">Stock<span class="logo-accent">Lens</span></span>
                </div>
            </a>
            <p class="logo-tagline">Screen · Analyze · Decide</p>
        </div>

        <nav class="sidebar-nav">
            <a href="#dashboard" class="nav-item active" data-page="dashboard">
                <span class="nav-icon">⬡</span>
                <span class="nav-label">Dashboard</span>
            </a>
            <a href="#screener" class="nav-item" data-page="screener">
                <span class="nav-icon">⏣</span>
                <span class="nav-label">Screener</span>
            </a>
            <a href="#analyzer" class="nav-item" data-page="analyzer">
                <span class="nav-icon">◉</span>
                <span class="nav-label">Analyzer</span>
            </a>
            <a href="#thesis" class="nav-item" data-page="thesis">
                <span class="nav-icon">⬢</span>
                <span class="nav-label">Thesis Board</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="sidebar-footer-text">
                <span class="footer-dot"></span>
                Powered by yfinance
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
        <!-- Pages render here -->
    </main>

    <!-- Scripts (order matters) -->
    <script src="js/utils.js?v=2"></script>
    <script src="js/charts.js?v=2"></script>
    <script src="js/dashboard.js?v=2"></script>
    <script src="js/screener.js?v=4"></script>
    <script src="js/analyzer.js?v=2"></script>
    <script src="js/thesis.js?v=2"></script>
    <script src="js/app.js?v=2"></script>
</body>
</html>
